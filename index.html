<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Belu Pastelería - Control Interno</title>

  <!-- Vinculación del Manifiesto PWA -->
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#ffffff" />

  <!-- Registro del Service Worker para PWA (con control de errores para no romper la app) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/pwabuilder-sw.js')
          .then(reg => console.log('Service Worker registrado con éxito:', reg))
          .catch(err => console.warn('No se pudo registrar el Service Worker:', err));
      });
    }
  </script>
</head>
<body>

  <!-- Contenedor principal de tu aplicación -->
  <div class="app" id="app"></div>
  <dialog id="dlg"></dialog>

  <!-- Script principal de tu app -->
  <script src="/src/main.jsx"></script> <!-- Si usas JavaScript vanilla o script.js, cambia la ruta aquí -->

</body>
</html>
